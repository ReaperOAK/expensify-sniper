[pytest]
testpaths = tests
python_files = test_*.py
# -p no:asyncio: pytest-asyncio is installed user-wide and emits an
# asyncio_default_fixture_loop_scope deprecation warning on every run. This
# project has no async tests, so the plugin is disabled rather than configured.
# Test output has to stay pristine -- a warning that is always present is a
# warning nobody reads, and it is where a real one goes to hide.
addopts = -q --strict-markers -p no:asyncio
